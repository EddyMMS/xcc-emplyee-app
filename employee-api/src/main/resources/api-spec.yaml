openapi: 3.0.3
info:
  title: management-app
  description: API for managing employees
  version: 1.0.11
servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /auth/register:
    post:
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid request data
        '401':
          description: Authentication required
        '403':
          description: Admin privileges required
        '409':
          description: Username already exists


  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A list of employees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/github/access_token:
    post:
      operationId: OAuthLogin
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubOAuthRequest'
      responses:
        '200':
          description: A github user/account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubOAuthResponse'



  /employees:
    get:
      summary: Get all employees
      operationId: listAllEmployees
      tags:
        - Employees
      responses:
        '200':
          description: A list of employees
          content:
            application/json:
              schema:
                type: list
                items:
                  $ref: '#/components/schemas/Employee'
    post:
      summary: Create a new employee
      tags:
        - Employees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEmployeeRequest'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /employees/{uuid}:
    get:
      summary: Get an employee by UUID
      tags:
        - Employees
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A single employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '404':
          description: Employee not found
    put:
      summary: Update an employee by UUID
      tags:
        - Employees
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '404':
          description: Employee not found
    delete:
      summary: Delete an employee by UUID
      tags:
        - Employees
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Employee deleted
        '404':
          description: Employee not found

components:
  schemas:
    NewEmployeeRequest:
      type: object
      properties:
        birthdate:
          type: string
          format: LocalDate
        hourlyRate:
          type: number
          format: double
          minimum: 0
        hoursPerWeek:
          type: integer
        gender:
          type: string
          enum:
            - M
            - W
            - D
        department:
          type: string
        name:
          $ref: '#/components/schemas/Name'
    Employee:
      type: object
      properties:
        uuid:
          type: string
        birthdate:
          type: string
          format: LocalDate
        hourlyRate:
          type: number
          format: double
          minimum: 0
        hoursPerWeek:
          type: integer
        monthlySalary:
          type: number
          format: double
        gender:
          type: string
          enum:
            - M
            - W
            - D
        department:
          type: string
        name:
          $ref: '#/components/schemas/Name'
    Name:
      type: object
      properties:
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required:
        - token
        - username
        - roles
        - departments
      properties:
        token:
          type: string
          description: JWT or session token
        username:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AccountRole'
        departments:
          type: array
          items:
            type: string

    AccountRole:
      type: string
      x-extensible-enum:
        - NONE
        - VIEWER
        - EDITOR
        - ADMIN

    GitHubOAuthRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: GitHub OAuth authorization code
        redirect_uri:
          type: string
          description: Optional redirect URI

    GitHubOAuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/GitHubOAuthUserResponse'

    GitHubOAuthUserResponse:
      type: object
      required:
        - username
        - github_id
        - email
      properties:
        username:
          type: string
        github_id:
          type: integer
          format: int32
        email:
          type: string

    RegisterRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          minLength: 5
          maxLength: 30
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AccountRole'
          default: [ ]
        departments:
          type: array
          items:
            type: string
          default: [ ]

    RegisterResponse:
      type: object
      required:
        - id
        - username
        - roles
        - department
      properties:
        id:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AccountRole'
        departments:
          type: array
          items:
            type: string